version: '3.8'

services:
  # Aplicação em modo produção
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-}
    container_name: markdrop-app
    ports:
      - "8080:80"
    restart: unless-stopped
    networks:
      - markdrop-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Aplicação em modo desenvolvimento
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: markdrop-app-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-}
      - NODE_ENV=development
    restart: unless-stopped
    networks:
      - markdrop-network
    profiles:
      - dev
    stdin_open: true
    tty: true

networks:
  markdrop-network:
    driver: bridge

